services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: competency
      POSTGRES_PASSWORD: competency
      POSTGRES_DB: competency
    ports:
      - "5433:5432"  # host 5433: a native PostgreSQL may already use 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competency"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://competency:competency@db:5432/competency
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
