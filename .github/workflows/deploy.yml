name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGION: asia-south1
  SERVICE: competency-api
  REPO: competency
  SQL_INSTANCE: student-competence:asia-south1:competency-db
  RUNTIME_SA: competency-api@student-competence.iam.gserviceaccount.com
  EVIDENCE_BUCKET: student-competence-evidence

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: competency
          POSTGRES_PASSWORD: competency
          POSTGRES_DB: competency
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U competency" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        env:
          PG: postgresql+psycopg://competency:competency@localhost:5432
        run: |
          pip install -r requirements-dev.txt
          # Migrations apply cleanly and match the models
          DATABASE_URL=$PG/competency alembic upgrade head
          DATABASE_URL=$PG/competency alembic check
          # Tests on Postgres (separate database)
          psql "postgresql://competency:competency@localhost:5432/competency" -c "CREATE DATABASE competency_test"
          TEST_DATABASE_URL=$PG/competency_test pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API image
        run: |
          IMAGE=${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA}
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image "$IMAGE" \
            --region ${REGION} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 \
            --memory 512Mi \
            --service-account ${RUNTIME_SA} \
            --add-cloudsql-instances ${SQL_INSTANCE} \
            --update-secrets DATABASE_URL=database-url:latest \
            --update-env-vars ENVIRONMENT=production,STORAGE_BACKEND=gcs,GCS_BUCKET=${EVIDENCE_BUCKET},FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy frontend to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
